[project]
name = "freight-audit"
version = "0.1.0"
description = "Reconcile contracted freight tariffs against billed charges and flag overcharges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
charts = ["matplotlib"]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
freight-audit = "freight_audit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=freight_audit --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
